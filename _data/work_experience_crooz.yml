crooz:
  role: Lead Technical Artist / Unity Developer
  time: 2014/01 ~ 2016/10
  company: <span translate="no"> Crooz </span> (Full-time)
  location: 'Tokyo, Japan'
  link: https://social-drum.cloudvent.net/clients/crooz/
  details: >-
  
   <div class="upper-row">
        <p class="game-title">Project: <span translate="no"> Final Fantasy Grandmasters </span> </p>
        <div class="game-platform">Platforms: Mobile (iPhone, Android)</div>
   </div><!--//upper-row-->

   <div class="upper-row">
        <div class="game-desc">A Final Fantasy series rpg game</div>
        <div class="game-teamsize">Team Size: 20 members</div>
   </div><!--//upper-row-->

   <p><i><u>Tech</u></i></p>
   <p>
       <span class="bullet-point">Python, Maya, C++, C#, FBX SDK, Unity (4, 5), NGUI</span>
   </p>

   <p><i><b><u>Work Award</u></b></i></p>
   <p>I developed a custom material animation solution and a suite of time-saving production tools for the Unity mobile game project 'Final Fantasy Grandmasters'.
      I received an MVP award from the company President on October 9th 2015 for my contributions to the project that:</p>
   <p>
        <span class="bullet-point"> Increased productivity</span>
        <span class="bullet-point"> Reduced manual workloads</span>
        <span class="bullet-point"> Helped to cut spending costs</span>
   </p>

     <p><i><u>Tool Development</u></i></p>
   <div>Unity Editor - Art To Engine Tools</div>
   <p>
        <span class="bullet-point"> Quick Prefab Setup Tool - Made a prefab creation tool, allowing artists to quickly create prefabs from imported FBX assets, with desired settings (unity project folder, prefab name, material shader, custom scripts)</span>
        <span class="bullet-point"> Quick Prefab Update Tool - Created a tool to update existing prefab geometry and animations from updated FBX assets</span>
        <span class="bullet-point"> Quick Animation Setup Tool - Created a tool to automatically create and setup Animation Clips and Animator Controllers from imported FBX assets</span>
        <span class="bullet-point"> Quick Animation Player - Developed a custom player utility, allowing artists to quickly preview game animation when in Unity edit model, instead of having to wait several minutes to enter Unity play mode to preview it.</span>
        <span class="bullet-point"> High Volume FBX Batch Import And Prefab Setup Tool - Made an automated FBX asset batch imporation and Unity prefab setup/update tool, allowing artists to automatically import and setup/update high volumes of FBX assets with only a few mouse clicks.</span>
        <span class="bullet-point"> Unity Look-Dev Tools - Created custom Unity game model viewer tools to allow artists to rapidly select, preview and quality check characters, equipment, enemies, maps and magic effects</span>
   </p>

   <p><i><u>R&D</u></i></p>
   <div> Unity Material Animation System (Color, Alpha, Texture UV Translation / Rotation / Scaling) </div>
   <p>
    Designed and implemented a custom solution for exporting material animation from Maya, and importing and animating material color, alpha, and texture UV coordinates in Unity.
    <span class="bullet-point"> Custom Maya C++ FBX Exporter - Designed and implemented specialized Maya FBX exporter to include custom animation data marked for Unity import. </span>
    <span class="bullet-point"> Custom Unity FBX Importer - Designed and implemented custom Unity FBX importer to import and handle marked material animation data exported from Maya.
    <span class="bullet-point"> Custom Material Animation Shader - Implemented custom animation driven material shader to modify material values in realtime. </span>
    <span class="bullet-point"> Custom Unity Material Animation Clip - Designed and implemented a custom Unity animation clip made from Maya material animation data, coupled with a custom shader to animate material values during playback.
   </p>

   <div>Particles</div>
   <p>
       <span class="bullet-point"> Particle Scaling System - Implemented a custom method to dynamically scale Unity particle effects at <u>runtime</u>, using gameobject hierarchy transforms</span>
   </p>

   <div>Meshes</div>
   <p>
       <span class="bullet-point"> Rendering Optimizations - Customized the Mesh Baker source code to compress <u>animated</u> models and reduce draw calls</span>
   </p>

    <p><i><u>Graphics Work</u></i></p>
    <div>Shaders and Post Effects</div>
    <p>
        <span class="bullet-point"> Character Skin Shader - Created a two-tone color skin shader</span>
        <span class="bullet-point"> Shining Crystal Shader - Made a crystal shader with dynamic specular lighting effects</span>
        <span class="bullet-point"> UV Scroll Shader - Made a texture scroll effect to animate planar water</span>
        <span class="bullet-point"> Post Outline Glow - Developed a highly optimized outline glow effect for armor and weapons</span>
    </p>

   <br/>
   
   <div class="upper-row">
        <p class="game-title">Project: <span translate="no"> ACR Drift </span> </p>
        <div class="game-platform">Platforms: Mobile (iPhone, Android)</div>
   </div><!--//upper-row-->

   <div class="upper-row">
        <div class="game-desc">A car drift racing game</div>
        <div class="game-teamsize">Team Size: 10 members</div>
   </div><!--//upper-row-->

   <p><i><u>Tech</u></i></p>
   <p>
       <span class="bullet-point"> C#, Unity 4, NGUI</span>
   </p>
   
   <p><i><u>UI Development</u></i></p>
   <p>
       <span class="bullet-point"> Game Screen UI - Used NGUI to implement UI elements for various screens (car selection, racing etc)</span>
   </p>

   <p><i><u>Gameplay</u></i></p>
   <p>
       <span class="bullet-point"> Gameplay Testing - Checked for racing fairness and game issues (graphics, physics, memory)</span>
