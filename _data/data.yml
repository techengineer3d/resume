projects:
  title: Projects
  intro: >-
  assignments:
    - title: <span translate="no"> RebrightFX - Cinematic Detail Enhancement Shader Post Effect </span>
      link: techengineer3d.github.io/portfolio/graphics
      alt-link: youtube.com/@rebrightfx
      category: Graphics Research
      location:
      time: 2025/03 ~ Present
      tagline: >-
        <p>
        As a part of my private graphics research, I developed a real-time, complex cinematic shader post effect for visually enhancing games and digital media like movies, shows, animation and images.
        </p>
        <p>
        <span class="bullet-point">Light sources look more emissive, bright and have a photonic appearance, illuminated surfaces look more physically lit.</span>
        <span class="bullet-point">Local contrast shadows help improve contour and shape definition, and can improve perception of spatial depth.</span>
        <span class="bullet-point">Image and micro-surface details become much sharper and clearer, with greater visual acuity.</span>
        <span class="bullet-point">Multi-layered bloom techniques add a cinematic touch, and help to improve illumination.</span>
        <span class="bullet-point">Color tone and vibrancy enhancements result in much richer and more vibrant colors.</span>
        </p>
        <p>
        Products intended for game development, gaming and media viewers is planned.
        </p>
        <p>
        Please see my <a href="http://techengineer3d.github.io/portfolio/graphics/">Portfolio Graphics</a> section and my <a href="https://www.youtube.com/@rebrightfx">Youtube Channel</a> for more details.<br/>
        My Portfolio and Youtube Channel links can be found at the top right of this resume in the sidebar.
        </p>
