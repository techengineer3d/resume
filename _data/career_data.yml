career-profile:
  title: Career Profile
  summary: >-
    <p>I have worked in the software development industry for over 15 years as an Engineer on PC, console and mobile game titles and native mobile apps.</p>
    <p>My main areas of expertise is tool development, workflow improvement, R&D, realtime 3D graphics shading and rendering, game engine programming and art production pipeline improvement.</p>
    <p>Being very passionate about game development, I like creating new technology, and improving the way people work individually and together.</p>
    
career-objective:
  title: Career Objective
  summary: >-
    Employment Goal:<br/>
    <span class="bullet-point">To work for a successful software development company with a positive, creative environment and an international atmosphere.</span>
    <br/>
    Job Position:<br/>
    <span class="bullet-point">I am strongly interested in obtaining a permanent senior or mid-level engineer position, or other development related position.</span>
    <br/>
    Motivation:<br/>
    <span class="bullet-point">I wish to contribute the knowledge and skills I have gained to make engaging, high quality software application experiences, improve internal operations, and connect with people and make friends in the industry.</span>

career-relocation:
  title: Career Relocation
  summary: >-
    <p>I am open to relocating internationally for my career.</p>

work-style:
  title: Work Style
  summary: >-
    <p>I can work on-site, hybrid or fully remote from home.</p>
    
    
  
 
    
    
   
