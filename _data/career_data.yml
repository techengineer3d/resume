career-profile:
  title: Career Profile
  summary: >-
    <p>I have worked in the software development industry for over 15 years as an Engineer and Techncial Artist on PC, console and mobile game titles.</p>
    <p>My main areas of expertise are: game programming, game engine tools, art pipeline tools, workflow improvement, R&D, realtime 3D shading and rendering</p>
    <p>Very passionate about creating and learning new technology, and improving the way people work individually and together as a team.</p>
    
career-objective:
  title: Career Objective
  summary: >-
     <p>Looking to permanently work for a successful and creative game development or media production company.</p>
     <p>Strongly interested in obtaining a permanent senior technical development position.</p>
     <p>Willing to accept contract based work when permanent positions are unavailable.</p>
     <p>I want to contribute the knowledge, experience and skills I have gained to make creative and engaging high quality entertainment experiences.</p>
     
career-relocation:
  title: Career Relocation
  summary: >-
    <p>I am open to relocating domestically for my career.</p>

work-style:
  title: Work Style
  summary: >-
    <p>I can work on-site, hybrid or fully remote from home.</p>
    <p>Comforatble with working 5-day and 4-day work weeks.</p>
    

    
  
 
    
    
   
