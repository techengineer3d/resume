  assignments:
    - title: <span translate="no"> RebrightFX - Advanced Realtime Image Enhancement For Digital Media</span>
      link: techengineer3d.github.io/portfolio/graphics
      alt-link: youtube.com/@rebrightfx
      category: Graphics Research
      location:
      time: 2025/03 ~ Present
      tagline: >-
        <p>
        As a part of my private graphics research, I developed a real-time, complex cinematic shader post effect for enhancing graphics image quality, with the aim of improving visuals for games, films, shows, animation and digital images.
        The goal was to create at least 2 products, one for home use to visually enhance personal game and movie libraries, and another aimed at use in game engines for game development.
        I wanted to make scenes and images stand out with a clearer image, sharper details, better definition, better color, and an improved sense of realism.
        </p>

        <p>
        Areas of digital graphics enhancement and improvement include:
        <span class="bullet-point">
        Emissive illumination
        </span> 
        <span class="bullet-point">
        Local contrast self-shadowing and visual perception of shape definition
        </span> 
        <span class="bullet-point">
        Visual perception of 3d object space and depth, and natural eye focus and tracking
        </span> 
        <span class="bullet-point">
        Image clarity and sharpness
        </span> 
        <span class="bullet-point">
        High definition fine image detail
        </span> 
        <span class="bullet-point">
        Cinematic look with multiple bloom and tonemapping techniques
        </span> 
        <span class="bullet-point">
        Richer color tones and vibrancy
        </span>  
        </p>
        <p>
        Please see my <a href="https://www.youtube.com/@rebrightfx">Youtube Channel</a> at: youtube.com/@rebrightfx for video samples.<br/>
        My Youtube Channel link can also be found at the top right of this resume in the sidebar.
        </p>
        <p>
        Detailed info and screenshots are available in the projects section of my <a href="https://techengineer3d.github.io/portfolio/projects/rebrightfx_post_effects/"> Online Portfolio </a> at:<br/>
        techengineer3d.github.io/portfolio/projects/rebrightfx_post_effects/ <br/>
        My Online Portfolio link can also be found at the top right of this resume in the sidebar.
        </p>
        <p>
        The home use version of RebrightFX is almost ready for release.<br/>
        Work on the game engine versions will commence after funding is secured for further development.
        </p>