   </p>

   <p><i><u>Critical Problem Solving - Maya & Perforce Network Issue</u></i></p>
   <div>
   <p>
       When COVID-19 started, 3D artists went home for remote work and discovered they could no longer connect from Maya to company Perforce servers over their home network. 
       There was an issue with a secure socket layer binary (SSL), that was the source of the issue.
       The problem prevented 3d art production from continuing, and everything came to a halt.
       I used my engineering skills to build a new SSL binary compatible with the Maya version being used by the 3D artists.
       This re-enabled network access from Maya to the on-premise company Perforce servers, and allowed 3D artists to continue their work remotely from home, saving the game's art production.
   </p>
   </div>
   
